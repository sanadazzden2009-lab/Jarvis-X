name: Build Jarvis APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet==0.85.3

      - name: Inject API Key
        run: sed -i 's/PUT_YOUR_REAL_GROQ_API_KEY_HERE/${{ secrets.GROQ_API_KEY }}/g' main.py

      - name: Build APK
        run: flet build apk --yes --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-App
          path: build/apk
          if-no-files-found: error
